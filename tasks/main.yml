---

- name: Add crontabs
  ansible.builtin.cron:
    name: "{{ item.name }}"
    minute: "{{ item.minute | default(omit) }}"
    hour: "{{ item.hour | default(omit) }}"
    day: "{{ item.day | default(omit) }}"
    month: "{{ item.month | default(omit) }}"
    weekday: "{{ item.weekday | default(omit) }}"
    user: "{{ item.user }}"
    job: "{{ item.command }}"
    cron_file: "cron-{{ item.name }}"
  loop: "{{ crontabs }}"
  loop_control:
    label: "{{ item.name }}"
  when: env in item.envs | default(cron_default_envs)
  tags: ['cron']

# Removal runs in every environment so a job pulled from one env's vars is
# cleaned up regardless of the env that originally created it.
- name: Clean up crontabs
  ansible.builtin.cron:
    name: "{{ item.name }}"
    cron_file: "cron-{{ item.name }}"
    state: absent
  loop: "{{ crontabs_remove }}"
  loop_control:
    label: "{{ item.name }}"
  tags: ['cron']

- name: Add systemd timer service unit files
  ansible.builtin.template:
    src: "etc.systemd.system.service.j2"
    dest: "/etc/systemd/system/{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ systemd_timers }}"
  loop_control:
    label: "{{ item.name }}"
  when: env in item.envs | default(cron_default_envs)
  notify: Reload systemd daemon
  tags: ['cron', 'systemd_timers']

- name: Add systemd timer unit files
  ansible.builtin.template:
    src: "etc.systemd.system.timer.j2"
    dest: "/etc/systemd/system/{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ systemd_timers }}"
  loop_control:
    label: "{{ item.name }}"
  when: env in item.envs | default(cron_default_envs)
  register: cron_timer_units
  notify: Reload systemd daemon
  tags: ['cron', 'systemd_timers']

# Flush handlers now so the daemon-reload happens before we enable/start the
# timers below. Otherwise systemd would not yet know about freshly written
# units when the enable/start task runs in the same play.
# Tagged 'always' rather than 'cron'/'systemd_timers' so the barrier still
# holds under every tag selection, including any added later. Flushing is a
# no-op when no handlers are pending, so it is safe to run unconditionally.
- name: Reload systemd to pick up new and changed units
  ansible.builtin.meta: flush_handlers
  tags: ['always']

- name: Ensure timers are enabled and started
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ systemd_timers }}"
  loop_control:
    label: "{{ item.name }}"
  when: env in item.envs | default(cron_default_envs)
  ignore_errors: "{{ ansible_check_mode }}"
  tags: ['cron', 'systemd_timers']

# A running timer keeps its old schedule until restarted, so restart only the
# timers whose unit file actually changed this run.
- name: Restart timers whose unit file changed
  ansible.builtin.systemd_service:
    name: "{{ item.item.name }}.timer"
    state: restarted
  loop: "{{ cron_timer_units.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.changed | default(false)
    - not ansible_check_mode
  tags: ['cron', 'systemd_timers']

# systemd_service errors on units that do not exist, so a second run after the
# unit file was removed would fail. Stop/disable only timers still present.
- name: Check whether unwanted timer units still exist
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item.name }}.timer"
  loop: "{{ systemd_timers_remove }}"
  loop_control:
    label: "{{ item.name }}"
  register: cron_timer_remove_units
  tags: ['cron', 'systemd_timers']

- name: Ensure unwanted timers are disabled and stopped
  ansible.builtin.systemd_service:
    name: "{{ item.item.name }}.timer"
    enabled: false
    state: stopped
  loop: "{{ cron_timer_remove_units.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists
  ignore_errors: "{{ ansible_check_mode }}"
  tags: ['cron', 'systemd_timers']

- name: Remove unwanted systemd timers
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.name }}.timer"
    state: absent
  loop: "{{ systemd_timers_remove }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd daemon
  tags: ['cron', 'systemd_timers']

- name: Remove unwanted systemd timer services
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.name }}.service"
    state: absent
  loop: "{{ systemd_timers_remove }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd daemon
  tags: ['cron', 'systemd_timers']
