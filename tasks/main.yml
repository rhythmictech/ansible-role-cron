

- name: add crontabs
  cron:
    name: "{{ item.name }}"
    minute: "{{ item.minute|default(omit) }}"
    hour: "{{ item.hour|default(omit) }}"
    user: "{{ item.user }}"
    job: "{{ item.command }}"
    cron_file: "cron-{{ item.name }}"
  with_items: "{{ crontabs }}"
  tags: ['cron']

- name: clean up crontabs
  cron:
    name: "{{ item.name }}"
    cron_file: "cron-{{ item.name }}"
    state: absent
  with_items: "{{ crontabs_remove }}"
  tags: ['cron']

- name: add systemd timer service files
  template: 
    src: "etc.systemd.system.service.j2"
    dest: "/etc/systemd/system/{{ item.name }}-timer.service"
    owner: root
    group: root
    mode: "0740"
  with_items: "{{ systemd_timers }}"
  notify: systemd_reload
  tags: ['cron','systemd_timers']
    

- name: add systemd timer files
  template: 
      src: "etc.systemd.system.timer.j2"
      dest: "/etc/systemd/system/{{ item.name }}-timer.timer"
      owner: root
      group: root
      mode: "0740"
  with_items: "{{ systemd_timers }}"
  notify: systemd_reload
  tags: ['cron','systemd_timers']

- name: ensure timers are enabled and started
  systemd_service:
    name: "{{ item.name }}-timer.timer"
    enabled: true
    state: started
  with_items: "{{ systemd_timers }}"
  tags: ['cron','systemd_timers']
