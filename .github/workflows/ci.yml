---
name: CI

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Weekly run to catch drift against new image/tooling releases.
    - cron: '30 4 * * 1'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: pip3 install ansible-core ansible-lint

      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: "Molecule (${{ matrix.distro }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rocky stands in for all EL rebuilds (Alma, Oracle) — no separate
        # Alma legs since they are 1:1 RHEL-compatible.
        distro:
          - rockylinux9
          - rockylinux10
          - amazonlinux2023
          - fedora42
          - debian12
          - debian13
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip3 install ansible-core molecule "molecule-plugins[docker]"

      - name: Run molecule test
        run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
