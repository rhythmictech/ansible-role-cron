---
- name: Verify
  hosts: all
  tasks:
    # --- crontabs ---
    - name: Read created cron file
      ansible.builtin.slurp:
        src: /etc/cron.d/cron-nightly-backup
      register: cron_backup

    - name: Assert cron job schedule and command were rendered
      ansible.builtin.assert:
        that:
          - "'30 2 * * * root /usr/local/bin/backup.sh' in cron_backup.content | b64decode"

    - name: Stat env-gated and removed cron files
      ansible.builtin.stat:
        path: "/etc/cron.d/{{ item }}"
      loop:
        - cron-prod-only-job
        - cron-old-job
      register: cron_absent

    - name: Assert env-gated job was skipped and stale job was removed
      ansible.builtin.assert:
        that: not item.stat.exists
        quiet: true
      loop: "{{ cron_absent.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- systemd timers ---
    - name: Read rendered cleanup units
      ansible.builtin.slurp:
        src: "/etc/systemd/system/{{ item }}"
      loop:
        - cleanup.timer
        - cleanup.service
        - componenty.timer
        - componenty.service
      register: unit_files

    - name: Assert cleanup timer directives were rendered
      ansible.builtin.assert:
        that:
          - "'OnCalendar=daily' in cleanup_timer"
          - "'Persistent=true' in cleanup_timer"
          - "'RandomizedDelaySec=300' in cleanup_timer"
          - "'AccuracySec=1min' in cleanup_timer"
          - "'Description=Daily temp cleanup' in cleanup_timer"
      vars:
        cleanup_timer: "{{ unit_files.results[0].content | b64decode }}"

    - name: Assert cleanup service directives were rendered
      ansible.builtin.assert:
        that:
          - "'ExecStart=/usr/local/bin/cleanup.sh' in cleanup_service"
          - "'User=root' in cleanup_service"
          - "'Environment=CLEANUP_DIR=/var/tmp' in cleanup_service"
      vars:
        cleanup_service: "{{ unit_files.results[1].content | b64decode }}"

    - name: Assert component-based schedule was assembled
      ansible.builtin.assert:
        that:
          - "'OnCalendar=Mon *-*-* 3:15:00' in componenty_timer"
          - "'Type=oneshot' in componenty_service"
          - "'User=nobody' in componenty_service"
      vars:
        componenty_timer: "{{ unit_files.results[2].content | b64decode }}"
        componenty_service: "{{ unit_files.results[3].content | b64decode }}"

    # Raw systemctl on purpose: verifying through the same module the role
    # uses could mask module-level bugs, and service_facts omits timer units.
    - name: Check timer states  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}.timer"
      loop:
        - cleanup
        - componenty
      register: timer_active
      changed_when: false

    - name: Check timers are enabled  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-enabled {{ item }}.timer"
      loop:
        - cleanup
        - componenty
      register: timer_enabled
      changed_when: false

    - name: Assert managed timers are active and enabled
      ansible.builtin.assert:
        that:
          - timer_active.results | map(attribute='stdout') | list == ['active', 'active']
          - timer_enabled.results | map(attribute='stdout') | list == ['enabled', 'enabled']

    # --- removals / gating ---
    - name: Stat units that must not exist
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}"
      loop:
        - prod-only-timer.timer
        - prod-only-timer.service
        - legacy-timer.timer
        - legacy-timer.service
      register: unit_absent

    - name: Assert env-gated timer was skipped and stale timer was removed
      ansible.builtin.assert:
        that: not item.stat.exists
        quiet: true
      loop: "{{ unit_absent.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check stale timer is no longer active  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active legacy-timer.timer
      register: legacy_state
      changed_when: false
      failed_when: legacy_state.stdout == 'active'
