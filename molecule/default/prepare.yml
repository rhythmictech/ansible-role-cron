---
# No `become`: the molecule docker connection already runs as root, and sudo
# inside minimal containers trips over PAM.
- name: Prepare
  hosts: all
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Install cron
      ansible.builtin.package:
        name: "{{ 'cron' if ansible_os_family == 'Debian' else 'cronie' }}"
        state: present

    # Seed a stale cron job and a stale timer so converge can prove that the
    # *_remove lists actually clean them up.
    - name: Create a stale cron job to be removed
      ansible.builtin.cron:
        name: old-job
        user: root
        job: /bin/true
        cron_file: cron-old-job

    - name: Create a stale timer service unit to be removed
      ansible.builtin.copy:
        dest: /etc/systemd/system/legacy-timer.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=legacy-timer

          [Service]
          Type=oneshot
          ExecStart=/bin/true

    - name: Create a stale timer unit to be removed
      ansible.builtin.copy:
        dest: /etc/systemd/system/legacy-timer.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=legacy-timer

          [Timer]
          Unit=legacy-timer.service
          OnCalendar=daily

          [Install]
          WantedBy=timers.target

    - name: Enable and start the stale timer
      ansible.builtin.systemd_service:
        name: legacy-timer.timer
        daemon_reload: true
        enabled: true
        state: started
